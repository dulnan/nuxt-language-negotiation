name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright-core install chromium
          npm run dev:prepare

      - name: Prettier/ESLint
        run: |
          npm run prettier
          npm run lint

      - name: TypeScript
        run: |
          npm run typecheck

      - name: Module Builder
        run: |
          npm run prepack

      - name: Vitest
        run: |
          npm run test
